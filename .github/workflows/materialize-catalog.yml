name: Materialize readable catalog capture
on:
  push:
    branches: [feat/dual-queue-visual-tracing-20261018]
    paths:
      - scripts/catalog-batch.js.br
      - test/catalog-batch.test.js.br
      - .github/workflows/materialize-catalog.yml
jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand and test the exact local source
        run: |
          node -e "const f=require('fs'),z=require('zlib');for(const p of ['scripts/catalog-batch.js','test/catalog-batch.test.js'])f.writeFileSync(p,z.brotliDecompressSync(f.readFileSync(p+'.br')))"
          node --check scripts/catalog-batch.js
          node --test test/catalog-batch.test.js
          npm test
      - name: Commit readable source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/catalog-batch.js test/catalog-batch.test.js
          git rm scripts/catalog-batch.js.br test/catalog-batch.test.js.br
          git commit -m 'feat: materialize readable local catalog capture and tests'
          git push origin HEAD:feat/dual-queue-visual-tracing-20261018
